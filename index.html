<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameMaker V2</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">🎮 GameMaker V2</div>
  <button onclick="newProject()">＋ New Project</button>
  <button onclick="playGame()">▶ Play</button>
  <button onclick="saveProject()">💾 Save</button>
</header>

<div class="editor">

  <!-- LEFT TOOLBAR -->
  <aside class="leftPanel">
    <h3>🛠️ Tools</h3>

    <button onclick="addPlayer()">🧙 Player</button>
    <button onclick="addEnemy()">👹 Enemy</button>
    <button onclick="addObject()">⬛ Object</button>
    <button onclick="deleteObject()">🗑️ Delete</button>
  </aside>

  <!-- GAME AREA -->
  <main>
    <div class="gameTop">
      <span>🎬 Scene 1</span>
      <span id="status">Editor Mode</span>
    </div>

    <div id="gameArea"></div>
  </main>

  <!-- RIGHT PROPERTIES -->
  <aside class="rightPanel">
    <h3>⚙️ Properties</h3>

    <p id="selectedName">Nothing Selected</p>

    <label>Object Name</label>
    <input id="objName" type="text">

    <label>X Position</label>
    <input id="objX" type="number">

    <label>Y Position</label>
    <input id="objY" type="number">

    <label>Width</label>
    <input id="objW" type="number" value="60">

    <label>Height</label>
    <input id="objH" type="number" value="60">

    <button onclick="applyProperties()">✅ Apply</button>
    <label>🖼️ Object Image</label>
<input id="objImage" type="file" accept="image/*">

<button onclick="applyImage()">
  🖼️ Apply Image
</button>

<button onclick="removeImage()">
  ❌ Remove Image
</button>
  </aside>

</div>
<script>
let selectedObject = null;
let objectCount = 0;
let isPlaying = false;

const gameArea = document.getElementById("gameArea");

function createObject(name, emoji, color) {

  objectCount++;

  const obj = document.createElement("div");

  obj.className = "object";
  obj.innerText = emoji;

  obj.dataset.name = name + objectCount;

  obj.style.left = "100px";
  obj.style.top = "100px";
  obj.style.background = color;

  gameArea.appendChild(obj);

  selectObject(obj);
  makeDraggable(obj);
}


// PLAYER
function addPlayer(){

  createObject(
    "Player",
    "🧙",
    "#2563eb"
  );
}


// ENEMY
function addEnemy(){

  createObject(
    "Enemy",
    "👹",
    "#dc2626"
  );
}


// NORMAL OBJECT
function addObject(){

  createObject(
    "Object",
    "⬛",
    "#64748b"
  );
}


// SELECT OBJECT
function selectObject(obj){

  if(selectedObject){
    selectedObject.classList.remove("selected");
  }

  selectedObject = obj;

  obj.classList.add("selected");

  document.getElementById("selectedName").innerText =
    obj.dataset.name;

  updateProperties();
}


// PROPERTIES UPDATE
function updateProperties(){

  if(!selectedObject) return;

  document.getElementById("objName").value =
    selectedObject.dataset.name;

  document.getElementById("objX").value =
    parseInt(selectedObject.style.left);

  document.getElementById("objY").value =
    parseInt(selectedObject.style.top);

  document.getElementById("objW").value =
    selectedObject.offsetWidth;

  document.getElementById("objH").value =
    selectedObject.offsetHeight;
}


// APPLY PROPERTIES
function applyProperties(){

  if(!selectedObject){
    alert("Select an object first!");
    return;
  }

  selectedObject.dataset.name =
    document.getElementById("objName").value;

  selectedObject.style.left =
    document.getElementById("objX").value + "px";

  selectedObject.style.top =
    document.getElementById("objY").value + "px";

  selectedObject.style.width =
    document.getElementById("objW").value + "px";

  selectedObject.style.height =
    document.getElementById("objH").value + "px";

  document.getElementById("selectedName").innerText =
    selectedObject.dataset.name;
}


// DRAG SYSTEM
function makeDraggable(obj){

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  obj.addEventListener("pointerdown", function(e){

    if(isPlaying) return;

    dragging = true;

    offsetX =
      e.clientX - obj.getBoundingClientRect().left;

    offsetY =
      e.clientY - obj.getBoundingClientRect().top;

    selectObject(obj);

    obj.setPointerCapture(e.pointerId);
  });


  obj.addEventListener("pointermove", function(e){

    if(!dragging || isPlaying) return;

    const area =
      gameArea.getBoundingClientRect();

    let x =
      e.clientX - area.left - offsetX;

    let y =
      e.clientY - area.top - offsetY;

    x = Math.max(0, x);
    y = Math.max(0, y);

    x = Math.min(
      x,
      gameArea.clientWidth - obj.offsetWidth
    );

    y = Math.min(
      y,
      gameArea.clientHeight - obj.offsetHeight
    );

    obj.style.left = x + "px";
    obj.style.top = y + "px";

    updateProperties();
  });


  obj.addEventListener("pointerup", function(){

    dragging = false;

  });
}


// DELETE
function deleteObject(){

  if(!selectedObject){
    alert("Select an object first!");
    return;
  }

  selectedObject.remove();

  selectedObject = null;

  document.getElementById("selectedName").innerText =
    "Nothing Selected";
}


// NEW PROJECT
function newProject(){

  if(confirm("Create a new project?")){

    gameArea.innerHTML = "";

    selectedObject = null;

    objectCount = 0;

    document.getElementById("selectedName").innerText =
      "Nothing Selected";
  }
}


// PLAY / EDITOR MODE
function playGame(){

  isPlaying = !isPlaying;

  const status =
    document.getElementById("status");

  if(isPlaying){

    status.innerText = "▶ Play Mode";

  }else{

    status.innerText = "Editor Mode";

  }
}


// SAVE PROJECT
function saveProject(){

  const project = {

    objects: [...gameArea.children].map(obj => ({

      name: obj.dataset.name,

      emoji: obj.innerText,

      x: parseInt(obj.style.left) || 0,

      y: parseInt(obj.style.top) || 0,

      width: obj.offsetWidth,

      height: obj.offsetHeight,

      color: obj.style.backgroundColor,

      image: obj.style.backgroundImage || ""

    }))

  };

  try{

    localStorage.setItem(
      "GameMakerV2Project",
      JSON.stringify(project)
    );

    alert("💾 Project Saved Successfully!");

  }catch(error){

    alert("⚠️ Storage full! Image size is too large.");

  }
}


// LOAD PROJECT
function loadProject(){

  const saved =
    localStorage.getItem("GameMakerV2Project");

  if(!saved) return;

  try{

    const project = JSON.parse(saved);

    gameArea.innerHTML = "";

    selectedObject = null;

    objectCount = 0;

    project.objects.forEach(data => {

      objectCount++;

      const obj =
        document.createElement("div");

      obj.className = "object";

      obj.innerText = data.emoji || "";

      obj.dataset.name = data.name;

      obj.style.left =
        (data.x || 0) + "px";

      obj.style.top =
        (data.y || 0) + "px";

      obj.style.width =
        (data.width || 60) + "px";

      obj.style.height =
        (data.height || 60) + "px";

      obj.style.backgroundColor =
        data.color || "#64748b";

      // 🖼️ Restore saved image
      if(data.image){

        obj.style.backgroundImage =
          data.image;

        obj.style.backgroundSize =
          "cover";

        obj.style.backgroundPosition =
          "center";

        obj.style.backgroundRepeat =
          "no-repeat";

        obj.innerText = "";

      }

      gameArea.appendChild(obj);

      makeDraggable(obj);

    });

    document.getElementById("selectedName").innerText =
      "Nothing Selected";

  }catch(error){

    console.log("Project load error:", error);

  }
}
  // 🎮 PLAYER MOVEMENT

let keys = {};

document.addEventListener("keydown", function(e){

  keys[e.key.toLowerCase()] = true;

});

document.addEventListener("keyup", function(e){

  keys[e.key.toLowerCase()] = false;

});


function movePlayer(){

  if(isPlaying){

    const player =
      [...gameArea.children].find(
        obj => obj.dataset.name.startsWith("Player")
      );

    if(!player) return;

    let x =
      parseInt(player.style.left) || 0;

    let y =
      parseInt(player.style.top) || 0;

    const speed = 4;

    if(keys["arrowleft"] || keys["a"]){
      x -= speed;
    }

    if(keys["arrowright"] || keys["d"]){
      x += speed;
    }

    if(keys["arrowup"] || keys["w"]){
      y -= speed;
    }

    if(keys["arrowdown"] || keys["s"]){
      y += speed;
    }

    // 🧱 Keep player inside game area

    x = Math.max(
      0,
      Math.min(
        x,
        gameArea.clientWidth - player.offsetWidth
      )
    );

    y = Math.max(
      0,
      Math.min(
        y,
        gameArea.clientHeight - player.offsetHeight
      )
    );

    player.style.left = x + "px";
    player.style.top = y + "px";

  }

  requestAnimationFrame(movePlayer);

}

movePlayer();


// AUTO LOAD
loadProject();
  function applyImage(){

  if(!selectedObject){
    alert("Select an object first!");
    return;
  }

  const file =
    document.getElementById("objImage").files[0];

  if(!file){
    alert("Please select an image!");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    selectedObject.style.backgroundImage =
      `url("${e.target.result}")`;

    selectedObject.style.backgroundSize =
      "cover";

    selectedObject.style.backgroundPosition =
      "center";

    selectedObject.style.backgroundRepeat =
      "no-repeat";

    selectedObject.innerText = "";

    alert("🖼️ Image Applied!");

  };

  reader.readAsDataURL(file);
  }


function removeImage(){

  if(!selectedObject){
    alert("Select an object first!");
    return;
  }

  selectedObject.style.backgroundImage = "none";

  selectedObject.innerText = "⬛";
}
</script>


</body>
</html>
