<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameMaker V2</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">🎮 GameMaker V2</div>
  <button onclick="newProject()">＋ New Project</button>
  <button onclick="playGame()">▶ Play</button>
  <button onclick="saveProject()">💾 Save</button>
</header>

<div class="editor">

  <!-- LEFT TOOLBAR -->
  <aside class="leftPanel">
    <h3>🛠️ Tools</h3>

    <button onclick="addPlayer()">🧙 Player</button>
    <button onclick="addEnemy()">👹 Enemy</button>
    <button onclick="addObject()">⬛ Object</button>
    <button onclick="deleteObject()">🗑️ Delete</button>
  </aside>

  <!-- GAME AREA -->
  <main>
    <div class="gameTop">
      <span>🎬 Scene 1</span>
      <span id="status">Editor Mode</span>
    </div>

    <div id="gameArea"></div>
  </main>

  <!-- RIGHT PROPERTIES -->
  <aside class="rightPanel">
    <h3>⚙️ Properties</h3>

    <p id="selectedName">Nothing Selected</p>

    <label>Object Name</label>
    <input id="objName" type="text">

    <label>X Position</label>
    <input id="objX" type="number">

    <label>Y Position</label>
    <input id="objY" type="number">

    <label>Width</label>
    <input id="objW" type="number" value="60">

    <label>Height</label>
    <input id="objH" type="number" value="60">

    <button onclick="applyProperties()">✅ Apply</button>
  </aside>

</div>

<script src="script.js"></script>

</body>
</html>
