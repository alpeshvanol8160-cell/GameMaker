<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameMaker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      padding: 15px;
      background: #1f2937;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #374151;
      overflow-x: auto;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.96);
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 500px;
      background: #dbeafe;
      overflow: hidden;
    }

    .player {
      position: absolute;
      width: 60px;
      height: 60px;
      background: red;
      border-radius: 10px;
      left: 50px;
      top: 50px;
      touch-action: none;
    }

    .info {
      padding: 12px;
      background: #1f2937;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>🎮 My GameMaker</header>

  <div class="toolbar">
    <button onclick="addObject()">➕ Add Object</button>
    <button onclick="playGame()">▶️ Play</button>
    <button onclick="resetGame()">🔄 Reset</button>
  </div>

  <div id="gameArea"></div>

  <div class="info">
    Objects: <span id="count">0</span>
  </div>

  <script>
    let objectCount = 0;

    function addObject() {
      const gameArea = document.getElementById("gameArea");

      const obj = document.createElement("div");
      obj.className = "player";

      obj.style.left = Math.random() * 250 + "px";
      obj.style.top = Math.random() * 300 + "px";

      gameArea.appendChild(obj);

      objectCount++;
      document.getElementById("count").textContent = objectCount;

      makeDraggable(obj);
    }

    function makeDraggable(obj) {
      let moving = false;
      let offsetX = 0;
      let offsetY = 0;

      obj.addEventListener("pointerdown", function(e) {
        moving = true;

        const rect = obj.getBoundingClientRect();

        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        obj.setPointerCapture(e.pointerId);
      });

      obj.addEventListener("pointermove", function(e) {
        if (!moving) return;

        const area = document.getElementById("gameArea");
        const rect = area.getBoundingClientRect();

        let x = e.clientX - rect.left - offsetX;
        let y = e.clientY - rect.top - offsetY;

        x = Math.max(0, Math.min(x, area.clientWidth - obj.offsetWidth));
        y = Math.max(0, Math.min(y, area.clientHeight - obj.offsetHeight));

        obj.style.left = x + "px";
        obj.style.top = y + "px";
      });

      obj.addEventListener("pointerup", function() {
        moving = false;
      });
    }

    function playGame() {
      alert("🎮 Game Preview Started!");
    }

    function resetGame() {
      document.getElementById("gameArea").innerHTML = "";
      objectCount = 0;
      document.getElementById("count").textContent = "0";
    }
  </script>

</body>
</html>
